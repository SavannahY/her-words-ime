# 她说：基于官方朙月拼音的系统全拼方案。
__include: luna_pinyin_simp.schema:/

schema:
  schema_id: her_words
  name: 她说 · 女性优先全拼
  version: "1.2"
  author:
    - 她说
  description: |
    标准中文全拼，离线输入。候选与上屏文字逐字将他转换为她。
    内置女性友好词语；ta 默认她，tamen 默认她们。
    默认友好表达，可在方案菜单切换保留措辞或社群写法。

translator:
  dictionary: her_pinyin
  prism: her_words
  user_dict: her_words
  # All new personalization lives in the reviewable local memory store.
  # Preserve any older Rime database on disk, but do not use or update it here.
  enable_user_dict: false

engine:
  filters:
    - simplifier
    - lua_filter@*her_filter
    - uniquifier

menu:
  page_size: 7

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: zh_simp
    reset: 1
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - options: [ her_original, her_friendly, her_community ]
    reset: 1
    states: [ 保留措辞, 友好表达, 社群写法 ]
