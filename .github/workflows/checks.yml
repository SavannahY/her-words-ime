name: Language packs and input engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install installer dependency
        run: python3 -m pip install -r requirements.txt
      - name: Validate sources, boundaries and examples
        run: python3 scripts/validate_packs.py
      - name: Run pack compiler tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify speech output processing
        run: node web/verify-speech-text.mjs
      - name: Compile selected language packs
        run: python3 scripts/compile_packs.py --output generated/her_rewrite_rules.lua
      - name: Compile the same language packs for the voice tool
        run: python3 scripts/compile_web_rules.py --output generated/web-rules.json
      - name: Verify committed iPhone resources and project
        run: |
          python3 scripts/compile_ios_data.py --check
          python3 scripts/generate_ios_project.py --check
  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared Swift input engine
        run: |
          swiftc -swift-version 5 -O ios/Shared/*.swift ios/Tests/EngineChecks.swift -o "$RUNNER_TEMP/her-engine-checks"
          "$RUNNER_TEMP/her-engine-checks" "$GITHUB_WORKSPACE"
      - name: Verify speech text cleanup
        run: |
          swiftc -swift-version 5 -O ios/Shared/*.swift ios/Tests/SpeechTextChecks.swift -o "$RUNNER_TEMP/her-speech-checks"
          "$RUNNER_TEMP/her-speech-checks" "$GITHUB_WORKSPACE"
      - name: Verify local word memory and suppression
        run: |
          swiftc -swift-version 5 -O ios/Shared/*.swift ios/Tests/WordMemoryChecks.swift -o "$RUNNER_TEMP/her-memory-checks"
          "$RUNNER_TEMP/her-memory-checks" "$GITHUB_WORKSPACE"
      - name: Verify Mac word memory file protocol
        run: |
          swiftc -swift-version 5 -O native/Sources/HerSpeechMac/MacWordMemoryStore.swift native/Tests/MacWordMemoryChecks.swift -o "$RUNNER_TEMP/her-mac-memory-checks"
          "$RUNNER_TEMP/her-mac-memory-checks"
          python3 tests/integration_memory_protocol.py
          python3 scripts/build_macos_word_memory_app.py
      - name: Verify native speech model and dependency boundary
        run: swift test --disable-keychain --disable-netrc
      - name: Package and verify standalone Mac speech app
        run: python3 scripts/build_macos_speech_app.py --configuration debug
      - name: Verify real public Chinese and English audio
        run: |
          swift run --disable-keychain --disable-netrc her-transcribe --download-model
          python3 scripts/fetch_speech_sample.py --output "$RUNNER_TEMP/her-public-mixed.wav"
          HER_ASR_TEST_MODEL_DIR="$HOME/Library/Application Support/HerWordsSpeech/zipformer-small-zh-en-2023-02-16" HER_ASR_TEST_WAV="$RUNNER_TEMP/her-public-mixed.wav" swift test --disable-keychain --disable-netrc --filter RecognitionIntegrationTests
      - name: Preserve standalone Mac tools
        run: |
          mkdir -p "$RUNNER_TEMP/her-mac-tools/cli"
          ditto -c -k --keepParent "dist/她说语音.app" "$RUNNER_TEMP/her-mac-tools/HerWordsSpeech-mac.zip"
          ditto -c -k --keepParent "dist/她说词库.app" "$RUNNER_TEMP/her-mac-tools/HerWordsMemory-mac.zip"
          cp .build/debug/her-transcribe "$RUNNER_TEMP/her-mac-tools/cli/"
          cp -R .build/debug/HerWordsSpeech_HerBilingualASR.bundle "$RUNNER_TEMP/her-mac-tools/cli/"
          ditto -c -k --keepParent "$RUNNER_TEMP/her-mac-tools/cli" "$RUNNER_TEMP/her-mac-tools/HerWordsTranscribe-mac.zip"
      - name: Upload Mac personal trial builds
        uses: actions/upload-artifact@v4
        with:
          name: Mac-personal-trial-builds
          path: ${{ runner.temp }}/her-mac-tools/*.zip
          retention-days: 7
      - name: Build iPhone simulator app and keyboard
        run: |
          if ! xcodebuild -project ios/HerWords.xcodeproj -scheme HerWords -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/her-simulator" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/her-simulator.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/her-simulator.log"
            exit 1
          fi
          test -d "$RUNNER_TEMP/her-simulator/Build/Products/Debug-iphonesimulator/HerWords.app/PlugIns/HerWordsKeyboard.appex"
      - name: Build iPhone device app and keyboard without signing
        run: |
          if ! xcodebuild -project ios/HerWords.xcodeproj -scheme HerWords -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/her-device" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/her-device.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/her-device.log"
            exit 1
          fi
          test -d "$RUNNER_TEMP/her-device/Build/Products/Release-iphoneos/HerWords.app/PlugIns/HerWordsKeyboard.appex"
      - name: Preserve unsigned build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-unsigned-build-and-logs
          path: |
            ${{ runner.temp }}/her-device/Build/Products/Release-iphoneos/HerWords.app
            ${{ runner.temp }}/her-device.log
            ${{ runner.temp }}/her-simulator.log
          retention-days: 7
  macos-engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official Squirrel release
        shell: bash
        run: |
          curl --fail --location --retry 2 https://github.com/rime/squirrel/releases/download/1.1.2/Squirrel-1.1.2.pkg -o "$RUNNER_TEMP/Squirrel.pkg"
          python3 - "$RUNNER_TEMP/Squirrel.pkg" <<'PY'
          import hashlib, pathlib, sys
          digest = hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest()
          assert digest == '614746013212937623d5bbab9901e9c43d1ec937aa32307d6b6092a05e308287', digest
          PY
          pkgutil --check-signature "$RUNNER_TEMP/Squirrel.pkg"
          pkgutil --expand-full "$RUNNER_TEMP/Squirrel.pkg" "$RUNNER_TEMP/squirrel"
      - name: Compile selected language packs
        run: python3 scripts/compile_packs.py --output rime/lua/her_rewrite_rules.lua
      - name: Verify actual librime candidates and commits
        run: python3 tests/integration_rime.py --app "$RUNNER_TEMP/squirrel/Payload/Squirrel.app" --config rime --report "$RUNNER_TEMP/her-words-results.json"
      - name: Verify real local word learning and deletion
        run: python3 tests/integration_word_memory.py --app "$RUNNER_TEMP/squirrel/Payload/Squirrel.app"
