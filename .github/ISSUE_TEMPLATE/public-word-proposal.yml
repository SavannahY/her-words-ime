name: 提议姓名、成语、品牌或网络常用词
description: 补充全拼可输入的公共词条，无需本地环境。
title: "[公共词库] 词条名称"
body:
  - type: markdown
    attributes:
      value: |
        欢迎补充公开女性人物姓名、常用成语、有来源说明的品牌名及全汉字网络常用词。请勿提交联系人、聊天内容或私人词库。
        品牌收录用于方便输入，创办历史或品牌自述不代表对其全部行为的评价。
  - type: dropdown
    id: category
    attributes:
      label: 类别
      options:
        - 女性人物姓名
        - 常用成语
        - 品牌名
        - 网络常用词
    validations:
      required: true
  - type: input
    id: text
    attributes:
      label: 词条
      description: 使用公开姓名、已有中文译名、正式品牌名或全汉字网络常用词。
      placeholder: 例如：屠呦呦
    validations:
      required: true
  - type: input
    id: pinyin
    attributes:
      label: 完整拼音
      description: 小写音节以空格分隔，ü 写作 v；不确定可注明。
      placeholder: tu you you
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 公开来源与收录依据
      description: 提供 HTTPS 链接，说明支持姓名、读音、词形或品牌相关事实。品牌请区分创办历史、项目自述与独立评价。
      placeholder: |
        来源标题与链接：
        领域或收录依据：
        多音字或不同译名需要说明的地方：
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: 贡献许可
      options:
        - label: 我同意将原创词条、简短说明及测试按项目 MIT 许可发布；外部来源仅以链接引用，不含私人词库。
          required: true
